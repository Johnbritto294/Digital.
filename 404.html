<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found | Stackly Digital</title><meta name="description" content="The page you are looking for could not be found.">
<link rel="preconnect" href="https://images.unsplash.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css?v=37" rel="stylesheet"></head>
<body>
<main class="section" style="min-height:100vh;display:flex;align-items:center;padding:3rem 0"><div class="container text-center">
<span class="tag">Error 404</span>
<h1 class="mt-3" style="font-size:clamp(4rem,14vw,9rem);color:var(--cobalt)">404</h1>
<h2 class="mt-2">Page not found</h2>
<p class="muted mx-auto mt-3">The page you are looking for does not exist or may have moved. Use the buttons below to get back on track.</p>
<div class="d-flex gap-3 justify-content-center flex-wrap mt-4">
<button type="button" class="btn btn-cobalt btn-lg" id="prev">Previous page</button>
<a href="index.html" class="btn btn-pink btn-lg">Back to home</a>
</div>
</div></main>
<script>
document.getElementById('prev').onclick=function(){
  var saved=null;
  try{saved=JSON.parse(sessionStorage.getItem('stackly_back_state')||'null')}catch(e){}
  if(saved&&saved.url&&saved.ts&&(Date.now()-saved.ts)<300000){location.replace(saved.url);return}
  if(history.length>1){history.back();return}
  if(document.referrer){location.href=document.referrer;return}
  location.href='dashboard.html';
};
</script>
</body></html>
